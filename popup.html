<!DOCTYPE html>
<html>

<head>
  <title>Duo GG</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body>
  <div class="header">
    <a href="https://duo.op.gg/en/lol/" target="_blank" rel="noreferrer" class="logo_link" aria-label="Open duo.op.gg">
      <img class="logo" src="duo_full.svg" alt="DUO">
    </a>
    <div class="logo_text">helper</div>
  </div>

  <div class="controls">
    <div class="field">
      <label class="label" for="roleSelect">Role</label>
      <select id="roleSelect" class="select">
        <option>All Positions</option>
        <option>Top</option>
        <option>Jungle</option>
        <option>Mid</option>
        <option>ADC</option>
        <option>Supp</option>
      </select>
    </div>

    <div class="field">
      <label class="label" for="tierSelect">Tier</label>
      <select id="tierSelect" class="select">
        <option>All</option>
        <option>Iron</option>
        <option>Bronze</option>
        <option>Silver</option>
        <option>Gold</option>
        <option>Platinum</option>
        <option>Emerald</option>
        <option>Diamond</option>
        <option>Master</option>
        <option>GM</option>
        <option>Challenger</option>
      </select>
    </div>

    <div class="field">
      <label class="label" for="divisionSelect">Division</label>
      <select id="divisionSelect" class="select">
        <option>I</option>
        <option>II</option>
        <option>III</option>
        <option>IV</option>
      </select>
    </div>

    <div class="field">
      <label class="label" for="winRateInput">Winrate</label>
      <input id="winRateInput" class="select" type="number" min="0" max="100" step="1" placeholder="e.g. 27" />
    </div>


    <div class="actions">
      <button class="button-menu" id="filterBtn">Filter</button>
      <span id="blacklistInfo" class="tooltip-icon" aria-label="Blacklist" title="Loading blacklist...">i</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
